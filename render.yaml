services:
  - type: web
    name: rielle-bubble-learn
    runtime: static
    # Publish only the app, not CLAUDE.md / README.md
    buildCommand: mkdir -p public/assets && cp index.html manifest.webmanifest sw.js public/ && cp assets/*.svg assets/*.png public/assets/
    staticPublishPath: ./public
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
